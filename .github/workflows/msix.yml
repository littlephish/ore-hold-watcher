name: MSIX

# Builds a signed .msix installer. Runs on the same version tags as the exe
# release (attaching the .msix + public .cer to that release), and can also be
# run by hand from the Actions tab for testing.
#
# Signing:
#   - Set repo secrets MSIX_PFX_BASE64 (base64 of a code-signing .pfx) and
#     MSIX_PFX_PASSWORD for a STABLE publisher identity. Stable signing is what
#     lets one install upgrade to the next - see packaging/README.md.
#   - With no secret, the workflow makes an EPHEMERAL self-signed cert so the
#     pipeline still produces an installable package (users trust the bundled
#     .cer first). Each such build has a different identity, so it can't
#     upgrade a previous install - fine for testing, not for shipping.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version x.y.z for a manual build"
        required: false
        default: "0.0.0"

permissions:
  contents: write   # attach assets to the GitHub Release

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_engine.py

  msix:
    name: Build & sign MSIX
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt nuitka

      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-msix-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: nuitka-msix-${{ runner.os }}-

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { $v = "0.0.0" }
          $p = $v.Split(".")
          while ($p.Count -lt 3) { $p += "0" }
          $file = $p[0..2] -join "."       # x.y.z for filenames / exe version
          $msix = "$file.0"                # MSIX Identity needs 4 parts, rev 0
          "file=$file" >> $env:GITHUB_OUTPUT
          "msix=$msix" >> $env:GITHUB_OUTPUT
          Write-Host "version file=$file msix=$msix"

      - name: Build (Nuitka standalone, version-stamped)
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=icon.ico `
            --company-name="LittlePhish" `
            --product-name="Ore Hold Watcher" `
            --file-version="${{ steps.ver.outputs.file }}" `
            --product-version="${{ steps.ver.outputs.file }}" `
            --output-filename=OreHoldWatcher.exe `
            --output-dir=build `
            app.py
          if (-not (Test-Path "build\app.dist\OreHoldWatcher.exe")) {
            throw "standalone build missing: build\app.dist\OreHoldWatcher.exe"
          }

      - name: Stage package layout + logo assets
        shell: pwsh
        run: |
          $pkg = "build\msix"
          Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$pkg\Assets" | Out-Null
          Copy-Item -Recurse -Force "build\app.dist\*" $pkg
          # render the required tile logos from icon.ico (largest frame)
          Add-Type -AssemblyName System.Drawing
          $ico = New-Object System.Drawing.Icon((Resolve-Path "icon.ico").Path, 256, 256)
          $src = $ico.ToBitmap()
          function Save-Png([int]$size, [string]$rel) {
            $bmp = New-Object System.Drawing.Bitmap $size, $size
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($src, 0, 0, $size, $size)
            $bmp.Save((Join-Path $pkg $rel), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          Save-Png 44  "Assets\Square44x44Logo.png"
          Save-Png 150 "Assets\Square150x150Logo.png"
          Save-Png 50  "Assets\StoreLogo.png"
          $src.Dispose(); $ico.Dispose()

      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.MSIX_PFX_BASE64 }}
          PFX_PW: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $pfx = "build\sign.pfx"
          if ($env:PFX_B64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            $pw = ConvertTo-SecureString $env:PFX_PW -AsPlainText -Force
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $pw)
            "selfsigned=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::warning::No MSIX_PFX_BASE64 secret - using an ephemeral self-signed cert. Users must trust the bundled .cer, and this build cannot upgrade an earlier install. See packaging/README.md."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject "CN=Ore Hold Watcher (self-signed)" `
              -FriendlyName "Ore Hold Watcher MSIX (self-signed)" `
              -KeyUsage DigitalSignature `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            $pw = ConvertTo-SecureString "orehold" -AsPlainText -Force
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
            "selfsigned=true" >> $env:GITHUB_OUTPUT
          }
          Export-Certificate -Cert $cert -FilePath "build\OreHoldWatcher.cer" | Out-Null
          # Identity/Publisher must equal the cert Subject exactly
          "subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT
          Write-Host "publisher subject: $($cert.Subject)"

      - name: Write manifest (inject version + publisher)
        shell: pwsh
        run: |
          $m = Get-Content "packaging\AppxManifest.xml" -Raw
          $m = $m.Replace("{{VERSION}}", "${{ steps.ver.outputs.msix }}")
          $m = $m.Replace("{{PUBLISHER}}", "${{ steps.cert.outputs.subject }}")
          Set-Content "build\msix\AppxManifest.xml" -Value $m -Encoding UTF8

      - name: Pack & sign
        id: pack
        shell: pwsh
        env:
          PFX_PW: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $bin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $bin) { throw "Windows SDK (makeappx/signtool) not found" }
          $makeappx = "$($bin.FullName)\x64\makeappx.exe"
          $signtool = "$($bin.FullName)\x64\signtool.exe"

          $out = "build\OreHoldWatcher-${{ steps.ver.outputs.file }}-x64.msix"
          & $makeappx pack /d "build\msix" /p $out /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }

          $pw = if ("${{ steps.cert.outputs.selfsigned }}" -eq "true") { "orehold" } else { $env:PFX_PW }
          & $signtool sign /fd SHA256 /f "build\sign.pfx" /p $pw $out
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          & $signtool verify /pa $out | Out-Host
          "msix=$out" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix
          path: |
            build/OreHoldWatcher-*-x64.msix
            build/OreHoldWatcher.cer
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/OreHoldWatcher-*-x64.msix
            build/OreHoldWatcher.cer
