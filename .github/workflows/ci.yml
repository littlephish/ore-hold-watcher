name: CI

# Lightweight checks only: byte-compile every module and run the engine tests.
# No packaging here - the Windows folder/zip/installer is built by release.yml
# on version tags.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Compile check & engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # compileall catches syntax errors without importing (no Qt needed)
      - name: Compile check
        run: python -m compileall -q app.py engine.py ores.py test_engine.py
      # engine/parser tests are pure stdlib
      - name: Engine tests
        run: python test_engine.py
