name: Release

# Tag a commit and push it to build the Windows artifacts and publish a release:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Ships a portable program folder (zip) AND an Inno Setup installer - NOT a
# onefile exe. A onefile build unpacks itself to %TEMP% and runs from there,
# which Microsoft Defender / CrowdStrike flag as dropper behaviour; a plain
# program folder does not, and it's what makes the in-app folder-swap updater
# possible.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_engine.py

  release:
    name: Build & publish Windows artifacts
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt nuitka

      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Read version from the tag
        id: ver
        shell: pwsh
        run: |
          # "v1.2.3" -> "1.2.3"; Windows version resources want x.y.z[.w]
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"

      # --standalone, never --onefile (see header). Nuitka writes the program
      # folder to build\app.dist\.
      - name: Build (Nuitka standalone, version-stamped from tag)
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=icon.ico `
            --company-name="LittlePhish" `
            --product-name="Ore Hold Watcher" `
            --file-version="${{ steps.ver.outputs.version }}" `
            --product-version="${{ steps.ver.outputs.version }}" `
            --file-description="Ore Hold Watcher" `
            --copyright="Ore Hold Watcher" `
            --output-dir=build `
            --output-filename=OreHoldWatcher.exe `
            app.py

      - name: Stage the program folder
        shell: pwsh
        run: |
          $dist = Get-ChildItem build -Directory -Filter *.dist | Select-Object -First 1
          if (-not $dist) { throw "Nuitka produced no program folder" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dist.FullName dist\OreHoldWatcher -Recurse
          if (-not (Test-Path "dist\OreHoldWatcher\OreHoldWatcher.exe")) {
            throw "staged folder missing OreHoldWatcher.exe"
          }

      # The updater looks for a *-win*.zip asset, so keep "win" in the name.
      - name: Zip the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\OreHoldWatcher `
            -DestinationPath dist\OreHoldWatcher-${{ steps.ver.outputs.version }}-win64.zip

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            # don't assume where choco put it
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles `
                       -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} `
            packaging\ore-hold-watcher.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Show what will be released
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length | Format-Table

      # Published, not a draft: the updater reads /releases/latest, which skips
      # drafts and prereleases entirely.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ore Hold Watcher ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/OreHoldWatcher-*-win64.zip
            dist/OreHoldWatcher-*-setup.exe
